name: Release desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            builder: --mac --arm64
            files: release/ErdemCut-mac-arm64.dmg
          - name: macOS x64
            os: macos-latest
            builder: --mac --x64
            ffmpeg_arch: x64
            files: release/ErdemCut-mac-x64.dmg
          - name: Windows x64
            os: windows-latest
            builder: --win --x64
            files: release/ErdemCut-windows-setup.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # ffmpeg-static downloads the binary for the RUNNER's architecture on install; the Intel
      # build runs on an Apple Silicon runner, so fetch the x64 one explicitly.
      - name: Fetch x64 ffmpeg for the Intel build
        if: matrix.ffmpeg_arch == 'x64'
        run: |
          rm -f node_modules/ffmpeg-static/ffmpeg
          node node_modules/ffmpeg-static/install.js
          file node_modules/ffmpeg-static/ffmpeg
        env:
          npm_config_arch: x64
          npm_config_platform: darwin

      - run: npm run build
      - run: npm run desktop:bundle
      - name: Package
        run: npx electron-builder ${{ matrix.builder }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: true
